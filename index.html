<title>Ma Cave à Vin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400;1,6..96,500&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout (Grand Cru): eyebrow header, big italic bottle count, floating bottom nav; "Cave" shows racks as grids of round bottle-ends; "Inventaire" lists wines; bottom sheet for actions */
:root {
  /* Grand Cru: a sommelier's cellar at night. Single dark look on purpose. */
  --bg: #120c13; --bg-2: #2a1a2b; --surface: #1b121c; --surface-2: #261a28; --fg: #efe6dc; --muted: #9b8f83; --line: #3a2a38;
  --gold: #c9a96e; --gold-soft: rgb(201 169 110 / .35); --gold-faint: rgb(201 169 110 / .14);
  --accent: #c9a96e; --accent-fg: #160e10; --accent-soft: rgb(201 169 110 / .12);
  --rack: #0b070c; --rack-cell: #160f17; --rack-label: #c9a96e;
  --w-rouge: #9c2338; --w-blanc: #e3c766; --w-rose: #f0a3b0; --w-bulles: #efe2a8; --w-liquoreux: #d48b1f; --w-autre: #8a8f98;
  --ok: #8fbf8a; --warn: #e0a55a; --danger: #e07a6e;
  --f-display: "Bodoni Moda", "Didot", Georgia, serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --radius: 4px; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 12px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; margin: 0; letter-spacing: .01em; }
h1 small { font-family: var(--f-body); font-size: .8rem; color: var(--muted); margin-left: 8px; font-weight: 500; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; background: var(--surface-2); border-radius: 999px; padding: 4px; }
nav.tabs button { border: 0; background: transparent; color: var(--muted); font: 600 .9rem var(--f-body); padding: 7px 16px; border-radius: 999px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
main { padding-block: 20px 80px; display: grid; gap: 20px; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; margin: 0; text-wrap: balance; }
.muted { color: var(--muted); }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
button, .btn { font: 600 .9rem var(--f-body); border-radius: 8px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
button.ghost { border-color: transparent; background: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }

/* Summary strip */
.summary { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: baseline; }
.summary .big { font-family: var(--f-display); font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
button.chip { font-weight: 500; }
button.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1px solid rgb(0 0 0 / .15); }
.c-rouge { background: var(--w-rouge); } .c-blanc { background: var(--w-blanc); } .c-rose { background: var(--w-rose); }
.c-bulles { background: var(--w-bulles); } .c-liquoreux { background: var(--w-liquoreux); } .c-autre { background: var(--w-autre); }

/* Racks */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .grow { flex: 1; min-width: 0; }
.banner { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner p { margin: 0; flex: 1; min-width: 200px; }
.rack { background: var(--rack); border-radius: 12px; padding: 14px; color: #f1ebef; min-width: 0; }
.rack-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.rack-head h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; margin: 0; color: #f6f0f3; }
.rack-head .meta { font-size: .8rem; color: var(--rack-label); font-variant-numeric: tabular-nums; }
.rack-head button { margin-left: auto; background: transparent; color: var(--rack-label); border-color: #5a4f57; padding: 5px 10px; font-size: .8rem; }
.rack-scroll { overflow-x: auto; padding-bottom: 4px; }
.grid { display: grid; gap: 6px; width: max-content; }
.axis { font: 500 .7rem var(--f-mono); color: var(--rack-label); display: grid; place-items: center; }
.cell { width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; background: var(--rack-cell); box-shadow: inset 0 2px 5px rgb(0 0 0 / .55); cursor: pointer; position: relative; }
.cell.full { box-shadow: inset 0 -3px 6px rgb(0 0 0 / .35), 0 0 0 2px rgb(0 0 0 / .25); }
.cell.full::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: rgb(0 0 0 / .22); }
.cell.hl { outline: 3px solid #fff; outline-offset: 2px; }
.cell.dim { opacity: .25; }
.cell.target { box-shadow: inset 0 0 0 2px #fff6; }
/* Realistic cabinet: deliberately single-look wood, same in both themes */
:root { --wood-hi: #c08a52; --wood: #9a6634; --wood-lo: #6e4421; --wood-dark: #3b2414; --wall: #1d130d; --lamp: #ffd9a0; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: .85rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.cab { display: grid; gap: 10px; min-width: 0; }
.cab-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cab-head h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; margin: 0; }
.cab-head .meta { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cab-head button { margin-left: auto; padding: 5px 10px; font-size: .8rem; }
.cab-body { display: flex; gap: 10px; align-items: stretch; min-width: 0; }
#legend { flex: 1 1 100%; }
.cab-frame { flex: 1; min-width: 0; max-width: calc(var(--cols) * 69px + 64px); border-radius: 6px 6px 3px 3px; padding: 16px 14px 18px;
  background:
    repeating-linear-gradient(90deg, rgb(0 0 0 / .07) 0 1px, transparent 1px 7px, rgb(255 255 255 / .04) 7px 8px, transparent 8px 13px),
    linear-gradient(180deg, var(--wood-hi), var(--wood) 30%, var(--wood-lo));
  box-shadow: inset 0 0 0 2px rgb(0 0 0 / .18), inset 0 10px 0 -4px rgb(255 255 255 / .12), 0 10px 24px -8px rgb(0 0 0 / .45); }
.cab-view { position: relative; height: calc(var(--lh) * 3); overflow: hidden; border-radius: 3px; touch-action: pan-x;
  background: radial-gradient(120% 70% at 50% 50%, #3a2617, var(--wall) 75%);
  box-shadow: inset 0 0 0 3px var(--wood-dark), inset 0 0 30px 6px rgb(0 0 0 / .7); }
.cab-view.all { height: auto; }
.cab-view.all .cab-stack { position: static; transform: none; will-change: auto; }
.cab-view.all .lvl { filter: none; }
.lvl.stk { height: calc(var(--lh) + var(--b) * .82); }
.shelves { display: grid; position: relative; z-index: 1; }
.shelf.up { margin-bottom: calc(var(--b) * -.18); padding-bottom: 0; z-index: 0; }
.shelf.up .cell::before { display: none; }
.cab-view:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.cab-stack { position: absolute; inset: 0 0 auto; will-change: transform; }
.lvl { height: var(--lh); display: grid; grid-template-columns: 22px 1fr; align-items: end; padding: 0 10px 0 4px; position: relative; filter: brightness(.45) saturate(.7); transition: filter .5s; }
.lvl.cur { filter: none; }
.lvl::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 12px; z-index: 0;
  background: repeating-linear-gradient(90deg, rgb(0 0 0 / .08) 0 2px, transparent 2px 11px), linear-gradient(180deg, var(--wood-hi), var(--wood) 45%, var(--wood-lo));
  box-shadow: 0 4px 6px rgb(0 0 0 / .55), inset 0 1px 0 rgb(255 255 255 / .25); }
.lvl-tag { font: 500 .72rem var(--f-mono); color: var(--lamp); opacity: .8; align-self: center; text-align: center; padding-bottom: 12px; }
.shelf { display: grid; grid-template-columns: repeat(var(--cols), var(--b)); gap: var(--gap); justify-content: center; position: relative; z-index: 1; padding-bottom: 7px; }
.cab .cell { width: var(--b); height: var(--b); border-radius: 50%; box-shadow: none; background: radial-gradient(circle, #050302 0 52%, #22160d 66%, transparent 70%); }
.cab .cell::before { content: ""; position: absolute; left: 6%; right: 6%; bottom: -7px; height: 9px; border-radius: 0 0 50% 50% / 0 0 100% 100%; background: var(--wood-lo); box-shadow: inset 0 2px 2px rgb(0 0 0 / .5); z-index: -1; }
.cab .cell.full { background:
    radial-gradient(circle at 50% 50%, rgb(0 0 0 / .55) 0 15%, transparent 22%),
    radial-gradient(circle at 34% 28%, rgb(255 255 255 / .55) 0 5%, transparent 16%),
    radial-gradient(circle, var(--wc) 0 30%, color-mix(in srgb, var(--wc) 55%, #000) 58%, #000 72%, color-mix(in srgb, var(--wc) 40%, #000) 84%, rgb(0 0 0 / .9) 100%);
  box-shadow: 0 3px 5px rgb(0 0 0 / .6); }
.cab .cell.full::after { display: none; }
.cab .cell.full.neck { background:
    radial-gradient(circle at 42% 38%, rgb(255 255 255 / .45) 0 4%, transparent 9%),
    radial-gradient(circle, var(--wc) 0 30%, color-mix(in srgb, var(--wc) 45%, #000) 36%, #1b2a1d 40%, #0e160f 62%, rgb(0 0 0 / .85) 72%, transparent 74%); }
.cab .shelf.q { gap: calc(var(--gap) - 2px); }
.cab .cell.hl { outline: 3px solid var(--lamp); outline-offset: 2px; }
.cab .cell.dim { opacity: .3; }
.cab .cell.target { box-shadow: inset 0 0 0 2px rgb(255 217 160 / .55); }
.lamp { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(60% 34% at 50% 48%, rgb(255 217 160 / .16), transparent 70%); }
.ladder { display: flex; flex-direction: column; gap: 4px; align-items: stretch; width: 56px; flex: none; }
.ladder button { padding: 6px 0; font-size: .8rem; }
.ladder .rungs { flex: 1; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0; max-height: calc(var(--lh) * 3 - 70px); }
.ladder .rung { border: 0; border-radius: 6px; background: transparent; padding: 3px 4px; font: 500 .72rem var(--f-mono); color: var(--muted); display: flex; justify-content: space-between; gap: 4px; }
.ladder .rung b { font-weight: 500; color: var(--fg); }
.ladder .rung[aria-current="true"] { background: var(--accent); color: var(--accent-fg); }
.ladder .rung[aria-current="true"] b { color: var(--accent-fg); }
.ladder .rung.has-hl { box-shadow: inset 0 0 0 2px var(--accent); }
.cab-foot { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { .cab-stack { transition: transform .6s cubic-bezier(.22, .9, .25, 1); } }
/* 3D view */
.w3 { position: relative; height: min(68vh, 620px); min-height: 380px; border-radius: 12px; overflow: hidden; background: var(--wall); touch-action: none; }
.w3 canvas { display: block; width: 100%; height: 100%; cursor: grab; }
.w3 canvas:active { cursor: grabbing; }
.w3-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none; }
.w3-top > * { pointer-events: auto; }
.w3-top .chip { background: rgb(20 12 8 / .7); color: #f3e6d6; border-color: rgb(255 217 160 / .25); backdrop-filter: blur(4px); }
.w3-top .chip[aria-pressed="true"] { background: var(--lamp); color: #2a180c; border-color: var(--lamp); }
.w3-nav { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.w3-nav button { background: rgb(20 12 8 / .75); color: #f3e6d6; border-color: rgb(255 217 160 / .3); min-width: 52px; }
.w3-nav .lv { text-align: center; font: 500 .8rem var(--f-mono); color: var(--lamp); background: rgb(20 12 8 / .75); border-radius: 8px; padding: 6px 4px; }
.w3-hint { position: absolute; left: 10px; bottom: 10px; right: 80px; font-size: .78rem; color: #d8c6b2; text-shadow: 0 1px 2px #000; pointer-events: none; }
.w3-tip { position: absolute; pointer-events: none; background: rgb(20 12 8 / .9); color: #fff; font-size: .8rem; padding: 5px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -130%); }
.w3-msg { position: absolute; inset: 0; display: grid; place-items: center; color: #e8d8c6; text-align: center; padding: 20px; }
.cell { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.cell.lifting { opacity: .25; }
.cell.drop { outline: 3px dashed var(--accent); outline-offset: 2px; }
.cab .cell.drop { outline-color: var(--lamp); }
.cell.ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -50%) scale(1.3); box-shadow: 0 12px 24px rgb(0 0 0 / .55); opacity: .95; transition: none; }
body.dragging, body.dragging * { cursor: grabbing !important; }
.stkset { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0; }
.stkset legend { font-size: .82rem; font-weight: 600; color: var(--muted); padding: 0 4px; }
.stkbox { display: flex; flex-wrap: wrap; gap: 6px; }
.stkopt { display: inline-flex !important; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; font: 500 .85rem var(--f-mono) !important; color: var(--fg) !important; cursor: pointer; }
.stkopt input { width: auto; margin: 0; }
.racklist { flex-basis: 100%; display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.racklist .rk { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.racklist .rk span { flex: 1 1 180px; min-width: 0; font-size: .9rem; }
.racklist .rk small { color: var(--muted); font-variant-numeric: tabular-nums; }
.racklist button { padding: 6px 10px; font-size: .82rem; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* Inventory */
input, select, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; }
.list { display: grid; gap: 10px; }
.wine { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: start; cursor: pointer; text-align: left; width: 100%; font-weight: 400; }
.wine:hover { border-color: var(--accent); }
.wine .dot { width: 14px; height: 14px; margin-top: 5px; }
.wine .name { font-weight: 700; font-size: 1rem; }
.wine .sub { color: var(--muted); font-size: .88rem; }
.wine .count { font-family: var(--f-display); font-size: 1.5rem; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
.wine .count small { display: block; font-family: var(--f-body); font-size: .7rem; color: var(--muted); }
.wine .locs { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px; }
.loc { font: 500 .72rem var(--f-mono); background: var(--surface-2); border-radius: 4px; padding: 2px 6px; }
.pill { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.pill.now { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.pill.late { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.pill.wait { background: var(--surface-2); color: var(--muted); }
.empty { text-align: center; padding: 36px 16px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.hist { display: grid; gap: 6px; font-size: .88rem; }
.hist div { display: flex; gap: 10px; align-items: center; }
.cellar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.cellar.on { border-color: var(--accent); background: var(--accent-soft); }
.cellar .pick-c { display: flex; gap: 12px; align-items: center; flex: 1 1 220px; min-width: 0; cursor: pointer; border: 0; background: transparent; padding: 0; text-align: left; font-weight: 400; }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; }
.cellar.on .radio { border-color: var(--accent); }
.cellar.on .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.cellar .cname { font-weight: 700; font-size: 1rem; }
.cellar .cmeta { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.cellar .actions { display: flex; gap: 6px; flex-wrap: wrap; }
.cellar .actions button { padding: 6px 10px; font-size: .82rem; }
.hist time { font: 500 .75rem var(--f-mono); color: var(--muted); min-width: 84px; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgb(10 5 12 / .5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 620px; max-height: 90%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 20px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 16px; } }
.sheet header { display: flex; gap: 12px; align-items: flex-start; }
.sheet header > div { flex: 1; min-width: 0; }
.sheet .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form .full { grid-column: 1 / -1; }
.form label { display: grid; gap: 4px; font-size: .82rem; font-weight: 600; color: var(--muted); }
@media (max-width: 520px) { .form { grid-template-columns: 1fr; } }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: .9rem; margin: 0; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }
.pick { display: grid; gap: 6px; max-height: 300px; overflow-y: auto; }
.pick button { display: flex; gap: 10px; align-items: center; text-align: left; font-weight: 500; }
.pick button span.grow { flex: 1; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 30; font-weight: 600; font-size: .9rem; }
@media (prefers-reduced-motion: no-preference) { .cell { transition: transform .12s; } .cell:hover { transform: scale(1.08); } }

/* map */
.mapsec { display: grid; gap: 8px; }
#map svg { width: 100%; max-width: 520px; height: auto; display: block; margin: 0 auto; }
#map .fr { fill: #1c141d; stroke: var(--gold-soft); stroke-width: 1.2; }
#map .towns circle { fill: var(--gold); fill-opacity: .9; stroke: var(--bg); stroke-width: 2.5; cursor: pointer; transition: r .2s; }
#map .towns.bues circle { fill: #e8dcc8; }
#map .town:hover circle, #map .town:focus-visible circle { stroke: var(--fg); outline: none; }
#map .town.on circle { fill: var(--fg); stroke: var(--gold); stroke-width: 4; }
#map .town { outline: none; }
.mapseg { justify-content: center; display: flex; margin-bottom: 4px; }
.map-drunk { max-height: 280px; overflow-y: auto; }
.townfld { position: relative; }
.sugg { position: absolute; z-index: 30; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--surface); border: 1px solid var(--gold-soft); border-radius: var(--radius); box-shadow: 0 12px 30px -8px rgb(0 0 0 / .8); display: grid; max-height: 260px; overflow-y: auto; }
.sugg button { border: 0; border-radius: 0; text-align: left; font-weight: 400; padding: 10px 12px; }
.sugg button:hover, .sugg button.act { background: var(--gold-faint); }

        else if (e.key === "Enter" && opts.length) { e.preventDefault(); pick(opts[Math.max(0, act)]); } else if (e.key === "Escape") { e.stopPropagation(); tl.hidden = true; } };
      ti.onblur = () => setTimeout(() => { tl.hidden = true; ti.setAttribute("aria-expanded", "false");
        if (!town && ti.value.trim() && COMMUNES_L) { const m = findCommunes(ti.value, 2); if (m.length && norm(m[0].n).trim() === norm(ti.value.replace(/\(.*$/, "")).trim()) pick(m[0]); } }, 120);
      showHint(); }
    if (v.bassin) { bsel.value = v.bassin; bsel.dataset.touched = "1"; } else autoB();
    bsel.onchange = () => { bsel.dataset.touched = "1"; hint.textContent = ""; };
    ["appellation", "region", "name", "domain"].forEach(id => $("#f-" + id).addEventListener("input", autoB));
    // Each slot holds an existing asset id (string), a new picture (Blob) or nothing (null).
    const photos = [0, 1].map(i => labelsOf(v)[i] || null); let photosTouched = false;
    if ($("#f-photo0")) [0, 1].forEach(i => {
      const fp = $("#f-photo" + i), prev = $("#f-prev" + i), btn = $("#f-pbtn" + i), del = $("#f-pdel" + i);
      btn.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fp.click(); } };
      fp.onchange = async () => {
        const file = fp.files && fp.files[0]; if (!file) return;
        prev.textContent = "Préparation…";
        try { photos[i] = await shrinkPhoto(file); photosTouched = true; prev.innerHTML = `<img src="${URL.createObjectURL(photos[i])}" alt="">`; del.hidden = false; btn.textContent = "Changer"; }
        catch (e) { prev.textContent = "Image illisible"; toast("Cette image ne peut pas être lue, essayez une autre photo."); }
      };
      del.onclick = () => { photos[i] = null; photosTouched = true; prev.textContent = PHOTO_SLOTS[i]; del.hidden = true; btn.textContent = "Prendre / choisir"; fp.value = ""; };
    });
    if (focusPhoto && $("#f-photo0")) setTimeout(() => { const i = labelsOf(v).length ? 1 : 0; $("#f-pbtn" + i).scrollIntoView({ block: "center" }); $("#f-photo" + i).click(); }, 50);
    $("#wf").onsubmit = async e => {
      e.preventDefault();
      const g = id => $("#f-" + id).value.trim();
      const data = { name: g("name"), domain: g("domain"), vintage: g("vintage"), appellation: g("appellation"), region: g("region"), bassin: g("bassin"), color: g("color"),
        grapes: g("grapes"), drinkFrom: g("drinkFrom"), drinkUntil: g("drinkUntil"), price: g("price"), loose: Math.max(0, parseInt(g("loose")) || 0), notes: g("notes"),
        town: town ? town.town : "", townDep: town ? town.townDep : "", lat: town ? town.lat : "", lon: town ? town.lon : "" };
      if (!data.name) return;
      const sub = $("#wf button[type=submit]");
      if (photosTouched) {
        sub.disabled = true; sub.textContent = "Envoi des photos…";
        try { for (let i = 0; i < 2; i++) if (photos[i] instanceof Blob) photos[i] = await uploadLabel(photos[i]); }
        catch (er) { sub.disabled = false; sub.textContent = w ? "Enregistrer" : "Ajouter le vin"; toast(er.message + " La fiche n'est pas encore enregistrée."); return; }
        data.labels = photos.filter(x => typeof x === "string"); data.label = data.labels[0] || "";
      }
      close();
      if (w) await save(() => S.db.doc("wines/" + w.id).update(data), "Fiche enregistrée");
      else { data.slots = placeAt ? [placeAt] : []; data.cellarId = curId() || null; data.createdAt = new Date().toISOString();
        await save(() => S.db.collection("wines").add(data), placeAt ? "Vin ajouté et rangé en " + slotLabel(placeAt) : "Vin ajouté"); }
    };
    $("#f-del") && ($("#f-del").onclick = () => {
      $("#f-confirm").innerHTML = `<div class="banner"><p>Supprimer « ${esc(w.name)} » et ses ${count(w)} bouteille(s) de l'inventaire ? Les places occupées seront libérées.</p><button class="danger" id="f-del-ok" type="button">Supprimer</button></div>`;
      $("#f-del-ok").onclick = () => { close(); save(() => S.db.doc("wines/" + w.id).delete(), "Vin supprimé"); };
    });
  });
}
function openRackForm(rk, cellarId) {
  const occ = occupancy(), cid = rk ? rackCellar(rk) : (cellarId || curId()), cname = S.cellars.find(c => c.id === cid)?.name || "";
  sheet(`<header><div><h2>${rk ? "Modifier le casier" : "Nouveau casier"}${cname ? ` · ${esc(cname)}` : ""}</h2><div class="muted">Les rangées sont nommées A, B, C… de haut en bas, les colonnes 1, 2, 3… de gauche à droite.</div></div><button class="ghost" data-close aria-label="Fermer">✕</button></header>
    <form class="form" id="rf">
      <label class="full" for="r-name">Nom<input id="r-name" required value="${esc(rk?.name || "")}" placeholder="ex. Casier du fond, Cave électrique…"></label>
      <label for="r-rows">Nombre d'étagères<input id="r-rows" type="number" min="1" max="40" required value="${rk?.rows || 6}"></label>
      <label for="r-cols">Bouteilles par rangée<input id="r-cols" type="number" min="1" max="40" required value="${rk?.cols || 8}"></label>
      <label class="full" for="r-layout">Rangement sur l'étagère<select id="r-layout">
        <option value="standard" ${rk?.layout !== "quinconce" ? "selected" : ""}>Côte à côte (tous les goulots vers l'avant)</option>
        <option value="quinconce" ${rk?.layout === "quinconce" ? "selected" : ""}>En quinconce (tête-bêche, une bouteille sur deux inversée)</option>
      </select></label>
      <fieldset class="full stkset"><legend>Deuxième rangée posée sur la première</legend>
        <p class="muted" style="margin:0 0 8px;font-size:.85rem">Cochez les étagères où vous couchez une 2e rangée de bouteilles par-dessus. Elle compte une bouteille de moins que la rangée du dessous.</p>
        <div class="stkbox" id="r-stk"></div>
        <div class="actions" style="margin-top:8px"><button type="button" id="stk-all">Toutes</button><button type="button" id="stk-none">Aucune</button></div>
      </fieldset>
      <div class="actions full"><button class="primary" type="submit">${rk ? "Enregistrer" : "Créer le casier"}</button><button type="button" data-close>Annuler</button>
      ${rk ? `<button type="button" class="danger" id="r-del" style="margin-left:auto">Supprimer</button>` : ""}</div>
      <div class="full" id="r-msg"></div>
    </form>`, () => {
    const chosen = new Set(rk ? [...stackedRows(rk)] : []);
    const drawStk = () => { const n = Math.min(40, Math.max(1, parseInt($("#r-rows").value) || 1));
      $("#r-stk").innerHTML = Array.from({ length: n }, (_, r) => `<label class="stkopt"><input type="checkbox" data-sr="${r}" ${chosen.has(r) ? "checked" : ""}> ${rowName(r)}</label>`).join("");
      $("#r-stk").querySelectorAll("input").forEach(i => i.onchange = () => { i.checked ? chosen.add(+i.dataset.sr) : chosen.delete(+i.dataset.sr); }); };
    drawStk(); $("#r-rows").oninput = drawStk;
    $("#stk-all").onclick = () => { const n = parseInt($("#r-rows").value) || 1; for (let r = 0; r < n; r++) chosen.add(r); drawStk(); };
    $("#stk-none").onclick = () => { chosen.clear(); drawStk(); };
    $("#rf").onsubmit = e => {
      e.preventDefault();
      const data = { name: $("#r-name").value.trim(), rows: Math.min(40, Math.max(1, parseInt($("#r-rows").value) || 1)), cols: Math.min(40, Math.max(1, parseInt($("#r-cols").value) || 1)), layout: $("#r-layout").value };
      data.stacked = [...chosen].filter(r => r < data.rows).sort((a, b) => a - b);
      if (rk) {
        const st = new Set(data.stacked), uc = Math.max(1, data.cols - 1);
        const lost = [...occ.keys()].filter(k => { const [id, r, c, l] = k.split("|"); return id === rk.id && (+r >= data.rows || (+l ? (!st.has(+r) || +c >= uc) : +c >= data.cols)); });
        if (lost.length) { $("#r-msg").innerHTML = `<div class="banner"><p>${lost.length} bouteille(s) sont rangées hors de ces nouvelles dimensions. Déplacez-les d'abord.</p></div>`; return; }
        close(); save(() => S.db.doc("racks/" + rk.id).update(data), "Casier modifié");
      } else { if (!cid) { $("#r-msg").innerHTML = `<div class="banner"><p>Créez d'abord une cave dans les réglages.</p></div>`; return; }
        data.order = racksOf(cid).length; data.cellarId = cid; close(); save(() => S.db.collection("racks").add(data), "Casier créé"); }
    };
    $("#r-del") && ($("#r-del").onclick = () => {
      const used = [...occ.keys()].filter(k => k.startsWith(rk.id + "|")).length;
      if (used) { $("#r-msg").innerHTML = `<div class="banner"><p>Ce casier contient encore ${used} bouteille(s). Videz-le avant de le supprimer.</p></div>`; return; }
      $("#r-msg").innerHTML = `<div class="banner"><p>Supprimer le casier « ${esc(rk.name)} » ?</p><button class="danger" type="button" id="r-del-ok">Supprimer</button></div>`;
      $("#r-del-ok").onclick = () => { close(); save(() => S.db.doc("racks/" + rk.id).delete(), "Casier supprimé"); };
    });
  });
}

/* ---------- Wiring ---------- */
$("#nav-add").onclick = () => openWineForm(null);
document.querySelectorAll("nav.tabs button[data-view]").forEach(b => b.onclick = () => { S.view = b.dataset.view; try { localStorage.setItem("cave.view", S.view); } catch (e) {} render(); });
$("#btn-add-rack").onclick = () => { S.view = "reglages"; render(); window.scrollTo({ top: 0 }); };
$("#btn-add-wine").onclick = () => openWineForm(null);
$("#btn-add-cellar").onclick = () => openCellarForm();
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { S.mode = b.dataset.mode; try { localStorage.setItem("cave.mode", S.mode); } catch (e) {} renderRacks(); });
try { const m = localStorage.getItem("cave.mode"); if (["plan", "etageres", "3d"].includes(m)) S.mode = m; } catch (e) {}
$("#hist-clear").onclick = () => {
  const n = S.drunkAll.length; if (!n) return;
  $("#hist-confirm").innerHTML = `<div class="banner" role="alertdialog" aria-label="Confirmer"><p>Effacer l'historique complet : <strong>${n} bouteille(s) bue(s)</strong>, toutes caves confondues ? Elles disparaîtront aussi de la carte « Bues depuis le début ». Les vins encore en cave ne sont pas touchés. Cette action est définitive.</p>
    <button class="danger" id="hc-yes">Oui, tout effacer</button> <button id="hc-no">Non, garder</button></div>`;
  $("#hc-no").onclick = () => { $("#hist-confirm").innerHTML = ""; };
  $("#hc-yes").onclick = async () => {
    $("#hist-confirm").innerHTML = `<p class="muted">Effacement en cours…</p>`;
    const ids = S.drunkAll.map(d => d.id); let fail = 0;
    for (let i = 0; i < ids.length; i += 10) {
      const res = await Promise.allSettled(ids.slice(i, i + 10).map(id => S.db.doc("drunk/" + id).delete()));
      fail += res.filter(r => r.status === "rejected").length;
    }
    $("#hist-confirm").innerHTML = "";
    toast(fail ? `${ids.length - fail} effacée(s), ${fail} n'ont pas pu l'être. Réessayez.` : "Historique effacé");
  };
};
$("#q").oninput = e => { S.q = e.target.value; renderInventory(); };
$("#sort").onchange = e => { S.sort = e.target.value; renderInventory(); };
try { if (localStorage.getItem("cave.map") === "bues") S.mapMode = "bues"; } catch (e) {}
try { const v = localStorage.getItem("cave.view"); if (["cave", "inventaire", "reglages"].includes(v)) S.view = v; } catch (e) {}
render();

(async () => {
  const timer = setTimeout(() => { if (!S.ready) { S.err = "La cave ne répond pas. Vérifiez la connexion puis rouvrez la page."; $("#sync").textContent = "hors ligne"; render(); } }, 10000);
  const db = window.claude ? await window.claude.use("db") : null;
  if (!db) { clearTimeout(timer); S.err = "Connectez-vous à claude.ai pour voir et enregistrer votre cave."; $("#sync").textContent = "non connecté"; render(); return; }
  S.db = db;
  try { S.assets = await window.claude.use("assets"); } catch (e) { S.assets = null; }
  let got = { racks: false, wines: false, cellars: false };
  const done = k => { got[k] = true; if (got.racks && got.wines && got.cellars) { clearTimeout(timer); S.ready = true; S.err = ""; $("#sync").textContent = "à jour"; } render(); };
  const fail = e => { clearTimeout(timer); S.err = "Lecture impossible : " + (e && e.message || "erreur inconnue"); $("#sync").textContent = "erreur"; render(); };
  db.collection("cellars").onSnapshot(s => { S.cellars = s.docs.map(d => ({ id: d.id, ...d.data() })); done("cellars"); }, fail);
  db.doc("settings/display").onSnapshot(s => { const id = s.exists ? s.data()?.cellarId : null; if (id && id !== S.cellarId) { S.cellarId = id; S.highlight = null; S.move = null; render(); } }, () => {});
  db.collection("racks").onSnapshot(s => { S.racks = s.docs.map(d => ({ id: d.id, ...d.data() })); done("racks"); }, fail);
  db.collection("wines").onSnapshot(s => { S.wines = s.docs.map(d => ({ id: d.id, ...d.data() })); done("wines"); }, fail);
  db.collection("drunk").orderBy("at", "desc").onSnapshot(s => { S.drunkAll = s.docs.map(d => ({ id: d.id, ...d.data() })); S.drunk = S.drunkAll.slice(0, 30); renderInventory(); }, () => {});
})();
</script>
